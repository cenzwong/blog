name: Deploy Cenz Blog to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.0.0
      - run: mise run setup
      - run: mise run test

  build-and-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5.0.0

      - name: Install Dependencies
        run: mise run setup

      - name: Build and Test Static Website
        run: mise run test

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v6

      - name: Upload Static Assets Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy static assets to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
