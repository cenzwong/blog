[tools]
node = "26.13.1"
pnpm = "10.15.0"

[tasks.setup]
description = "Install dependencies and browser tools"
run = ["pnpm install --frozen-lockfile", "pnpm run setup:browser", "pnpm run setup:playwright"]

[tasks.dev]
description = "Build, serve, and watch article sources"
run = "pnpm run dev"

[tasks.build]
description = "Build and validate the static site and search index"
run = "pnpm run build"

[tasks.test]
description = "Build the site and run the automated tests"
run = "pnpm test"

[tasks.preview]
description = "Serve the last production build"
run = "pnpm run preview"

[tasks.check]
description = "Check Astro and TypeScript diagnostics"
run = "pnpm run check"
